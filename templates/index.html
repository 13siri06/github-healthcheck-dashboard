<!DOCTYPE html>
<html>
<head>
    <title>GitHub Health Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0366d6;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0256b8;
        }
    </style>
</head>
<body>
    <h1>GitHub Account Health Dashboard</h1>
    <p>Enter a GitHub username to analyze their repos:</p>
    
    <form method="POST" action="/search">
        <input 
            type="text" 
            name="username" 
            placeholder="e.g., torvalds, octocat"
            required
        >
        <button type="submit">Search</button>
    </form>
</body>
</html>
