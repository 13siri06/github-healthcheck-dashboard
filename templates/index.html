<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Health Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-dim: #8b949e;
        --blue: #58a6ff;
        --blue-deep: #0366d6;
        --purple: #6f42c1;
        --green: #3fb950;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .wrap {
        width: 100%;
        max-width: 560px;
    }

    .eyebrow {
        font-family: 'SF Mono', 'Consolas', monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 10px;
        text-align: center;
    }

    h1 {
        font-size: 30px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .subtitle {
        text-align: center;
        color: var(--text-dim);
        font-size: 14px;
        margin-bottom: 36px;
    }

    /* Terminal window — the signature element */
    .terminal {
        background: #010409;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .terminal-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #161b22;
        border-bottom: 1px solid var(--border);
    }

    .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .terminal-title {
        flex: 1;
        text-align: center;
        font-family: 'SF Mono', 'Consolas', monospace;
        font-size: 12px;
        color: var(--text-dim);
        margin-right: 40px;
    }

    .terminal-body {
        padding: 28px 24px 32px;
        font-family: 'SF Mono', 'Consolas', monospace;
        font-size: 15px;
    }

    .terminal-line {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        position: relative;
    }

    .prompt-symbol {
        color: var(--green);
        font-weight: 700;
        white-space: nowrap;
    }

    .prompt-cmd {
        color: var(--text-dim);
        white-space: nowrap;
    }

    form {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 160px;
        position: relative;
    }

    input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--blue);
        font-family: inherit;
        font-size: 15px;
        caret-color: var(--green);
        padding: 4px 0;
    }

    input[type="text"]::placeholder {
        color: #3d444d;
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 17px;
        background: var(--green);
        margin-left: 2px;
        animation: blink 1s step-end infinite;
    }

    input[type="text"]:focus ~ .cursor,
    input[type="text"]:not(:placeholder-shown) ~ .cursor {
        display: none;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; }
    }

    .run-row {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px dashed var(--border);
        display: flex;
        justify-content: flex-end;
    }

    button {
        font-family: 'SF Mono', 'Consolas', monospace;
        font-size: 13px;
        font-weight: 600;
        background: var(--blue-deep);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
        background: #0256b8;
    }

    button:active {
        transform: scale(0.97);
    }

    button:focus-visible,
    input[type="text"]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
    }

    .hint {
        text-align: center;
        color: var(--text-dim);
        font-size: 12px;
        margin-top: 20px;
    }

    .hint code {
        font-family: 'SF Mono', 'Consolas', monospace;
        background: var(--card);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--text);
    }
</style>
</head>
<body>

<div class="wrap">
    <p class="eyebrow">Repository health, analyzed</p>
    <h1>GitHub Health Dashboard</h1>
    <p class="subtitle">Enter any public GitHub username to score their repos on activity, community, and maintenance.</p>

    <div class="terminal">
        <div class="terminal-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal-title">bash — ghealth</span>
        </div>
        <div class="terminal-body">
            <form method="POST" action="/search" id="searchForm">
                <div class="terminal-line">
                    <span class="prompt-symbol">$</span>
                    <span class="prompt-cmd">ghealth check --user</span>
                    <input
                        type="text"
                        name="username"
                        placeholder="octocat"
                        autocomplete="off"
                        autofocus
                        required
                    >
                    <span class="cursor"></span>
                </div>
                <div class="run-row">
                    <button type="submit">Run analysis →</button>
                </div>
            </form>
        </div>
    </div>

    <p class="hint">Or just type the username and hit <code>Enter</code></p>
</div>

</body>
</html>
