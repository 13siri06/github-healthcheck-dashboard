<!DOCTYPE html>
<html>
<head>
    <title>Results - GitHub Health Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #0366d6;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f6f8fa;
        }
        a {
            color: #0366d6;
        }
    </style>
</head>
<body>
    <h1>Results for: {{ username }}</h1>
    <p>Total Repos: {{ repos|length }}</p>
    
    <table>
        <tr>
            <th>Repo Name</th>
            <th>Stars</th>
            <th>Forks</th>
            <th>Activity</th>
            <th>Community</th>
            <th>Maintenance</th>
        </tr>
        {% for repo in repos %}
        <tr>
            <td>{{ repo.name }}</td>
            <td>{{ repo.stars }}</td>
            <td>{{ repo.forks }}</td>
            <td>{{ repo.activity }}/10</td>
            <td>{{ repo.community }}/10</td>
            <td>{{ repo.maintenance }}/10</td>
        </tr>
        {% endfor %}
    </table>
    
    <br>
    <a href="/">← Search Another User</a>
</body>
</html>
